name: cv-docker-prod

x-runtime-defaults: &runtime_defaults
  restart: unless-stopped

x-dns-defaults: &dns_defaults
  dns:
    - "${DOCKER_DNS_1:-1.1.1.1}"
    - "${DOCKER_DNS_2:-8.8.8.8}"
  dns_opt:
    - timeout:2
    - attempts:3

services:
  caddy:
    <<: *runtime_defaults
    image: caddy:2.8-alpine
    environment:
      STATEFUL_DOMAIN: ${STATEFUL_DOMAIN:-localhost:80}
      STATEFUL_BASIC_AUTH_USER: ${STATEFUL_BASIC_AUTH_USER:-admin}
      STATEFUL_BASIC_AUTH_HASH: ${STATEFUL_BASIC_AUTH_HASH:-replace_with_caddy_hash}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile.stateful:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started

  frontend:
    <<: *runtime_defaults
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_DEMO_VIDEO_URL: ${VITE_DEMO_VIDEO_URL:-}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: [*runtime_defaults, *dns_defaults]
    build:
      context: ./api
    environment:
      APP_ENV: production
      REQUIRE_API_AUTH: "false"
      API_ENABLE_DOCS: "false"
      API_PUBLIC_FILES_ENABLED: "true"
      API_ALLOWED_ORIGINS: ""
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      PROFILE_DIR: /app/data/profile
      OUTPUT_DIR: /app/outputs
      COMPILER_URL: http://typst-compiler:8001
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${STATEFUL_DOMAIN}}
      MAX_COMPILE_RETRIES: ${MAX_COMPILE_RETRIES:-4}
      MAX_GENERATOR_RETRIES: ${MAX_GENERATOR_RETRIES:-2}
      MAX_SCORER_RETRIES: ${MAX_SCORER_RETRIES:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ABACUS_API_KEY: ${ABACUS_API_KEY:-}
      ABACUS_BASE_URL: ${ABACUS_BASE_URL:-https://routellm.abacus.ai/v1}
      MODEL_NAME: ${MODEL_NAME:-gpt-5-mini}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      ENABLE_DEMO_MODE: ${ENABLE_DEMO_MODE:-false}
    volumes:
      - ${STATEFUL_DATA_DIR:-./data.prod}:/app/data
      - ${STATEFUL_OUTPUT_DIR:-./outputs.prod}:/app/outputs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      typst-compiler:
        condition: service_healthy

  typst-compiler:
    <<: *runtime_defaults
    build:
      context: ./compiler
    environment:
      TMP_DIR: /tmp/typst
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  telegram-bot:
    <<: [*runtime_defaults, *dns_defaults]
    profiles: ["telegram"]
    build:
      context: ./telegram-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      API_URL: http://api:8000
      OUTPUT_BASENAME: ${OUTPUT_BASENAME:-tailored-resume}
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400

volumes:
  caddy_data:
  caddy_config:
